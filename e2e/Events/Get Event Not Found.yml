info:
  name: Get Event Not Found
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/events/99999999"
  headers:
    - name: accept
      value: application/json
  body:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 404", function() {
          expect(res.status).to.equal(404);
        });
        test("error code is event_not_found", function() {
          expect(res.body.code).to.equal("event_not_found");
        });
        test("details include event_id", function() {
          expect(res.body.details.event_id).to.equal(99999999);
        });

settings:
  encodeUrl: true

docs: |-
  Get em id inexistente.

  **Espera:** 404, `code: event_not_found` e `details.event_id = 99999999`.
