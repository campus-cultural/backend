info:
  name: List Events
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/events"
  headers:
    - name: accept
      value: application/json
  body:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("body is an array", function() {
          expect(res.body).to.be.an("array");
          expect(res.body.length).to.be.above(0);
        });
        test("includes the created event", function() {
          const eventId = Number(bru.getVar("eventId"));
          const found = res.body.find(e => e.id === eventId);
          expect(found, "created event in list").to.not.equal(undefined);
        });

settings:
  encodeUrl: true

docs: |-
  Lista todos os eventos (rota pública).

  **Espera:** 200, array não vazio contendo o evento criado neste run.
