info:
  name: Create Event Missing Field
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/events"
  headers:
    - name: accept
      value: application/json
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Evento Incompleto"
      }
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 422", function() {
          expect(res.status).to.equal(422);
        });
        test("error code is validation_error", function() {
          expect(res.body.code).to.equal("validation_error");
        });
        test("details list missing fields", function() {
          expect(res.body.details).to.have.property("errors");
          expect(res.body.details.errors.length).to.be.above(0);
        });

settings:
  encodeUrl: true

docs: |-
  Payload incompleto (só `name`).

  **Espera:** 422, `code: validation_error` e `details.errors` listando os campos faltantes.
