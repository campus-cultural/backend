info:
  name: Update User
  type: http
  seq: 6

http:
  method: PUT
  url: "{{baseUrl}}/users/{{studentId}}"
  headers:
    - name: accept
      value: application/json
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "role": "student",
        "email": "{{studentEmail}}",
        "name": "Estudante Atualizado",
        "last_name": "E2E",
        "password": "{{studentPassword}}",
        "is_active": true,
        "ra": "{{studentRa}}",
        "birth_date": null
      }
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("name was updated", function() {
          expect(res.body.name).to.equal("Estudante Atualizado");
        });
        test("identity is preserved", function() {
          expect(String(res.body.id)).to.equal(bru.getVar("studentId"));
          expect(res.body.email).to.equal(bru.getVar("studentEmail"));
        });

settings:
  encodeUrl: true

docs: |-
  Atualiza o `name` do estudante mantendo todos os outros campos.

  **Espera:** 200, `name` atualizado e `id`/`email` preservados.
