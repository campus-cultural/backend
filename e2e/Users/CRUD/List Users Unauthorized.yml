info:
  name: List Users Unauthorized
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/users"
  headers:
    - name: accept
      value: application/json
  body:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 401", function() {
          expect(res.status).to.equal(401);
        });
        test("error code is invalid_token", function() {
          expect(res.body.code).to.equal("invalid_token");
        });

settings:
  encodeUrl: true

docs: |-
  Lista usuários sem token.

  **Espera:** 401 com `code: invalid_token`.
