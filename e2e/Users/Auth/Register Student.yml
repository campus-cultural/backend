info:
  name: Register Student
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/users/register"
  headers:
    - name: accept
      value: application/json
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "role": "student",
        "email": "{{studentEmail}}",
        "name": "Estudante",
        "last_name": "E2E",
        "password": "{{studentPassword}}",
        "is_active": true,
        "ra": "{{studentRa}}",
        "birth_date": null
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        const stamp = Date.now();
        bru.setVar("studentEmail", `student-${stamp}@e2e.test`);
        bru.setVar("studentRa", `RA${stamp}`);
        bru.setVar("studentPassword", "secret123");
    - type: tests
      code: |-
        test("status is 201", function() {
          expect(res.status).to.equal(201);
        });
        test("body echoes input", function() {
          expect(res.body).to.have.property("id");
          expect(res.body.email).to.equal(bru.getVar("studentEmail"));
          expect(res.body.role).to.equal("student");
          expect(res.body.ra).to.equal(bru.getVar("studentRa"));
        });
        test("password is not returned", function() {
          expect(res.body).to.not.have.property("password");
          expect(res.body).to.not.have.property("password_hash");
        });
        bru.setVar("studentId", String(res.body.id));

settings:
  encodeUrl: true

docs: |-
  Registra um aluno novo. O script `before-request` gera e-mail e RA únicos por run via `Date.now()`, garantindo idempotência.

  **Espera:** 201, body com `id`, role `student`, e-mail e RA ecoando o payload, e nenhum campo de senha exposto.

  Armazena `studentId` para uso pelos requests subsequentes.
