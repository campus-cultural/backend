info:
  name: Refresh Token
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/users/refresh-token"
  headers:
    - name: accept
      value: application/json
  body:
    type: none
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 200", function() {
          expect(res.status).to.equal(200);
        });
        test("returns a new token", function() {
          expect(res.body.access_token).to.be.a("string").and.not.empty;
          expect(res.body.token_type).to.equal("bearer");
        });
        bru.setVar("authToken", res.body.access_token);

settings:
  encodeUrl: true

docs: |-
  Renova o token usando `authToken` válido.

  **Espera:** 200 e novo `access_token`.

  Sobrescreve `authToken` com o token novo.
