info:
  name: Refresh Token Malformed
  type: http
  seq: 14

http:
  method: POST
  url: "{{baseUrl}}/users/refresh-token"
  headers:
    - name: accept
      value: application/json
  body:
    type: none
  auth:
    type: bearer
    token: "not-a-real-jwt"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 401", function() {
          expect(res.status).to.equal(401);
        });
        test("error code is invalid_token", function() {
          expect(res.body.code).to.equal("invalid_token");
        });

settings:
  encodeUrl: true

docs: |-
  Refresh com token JWT mal formado.

  **Espera:** 401 com `code: invalid_token`.
