info:
  name: Login Wrong Password
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/users/login"
  headers:
    - name: accept
      value: application/json
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{adminEmail}}",
        "password": "definitely-wrong"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 401", function() {
          expect(res.status).to.equal(401);
        });
        test("error code is invalid_credentials", function() {
          expect(res.body.code).to.equal("invalid_credentials");
        });

settings:
  encodeUrl: true

docs: |-
  Login com senha incorreta para o admin.

  **Espera:** 401 com `code: invalid_credentials`.
