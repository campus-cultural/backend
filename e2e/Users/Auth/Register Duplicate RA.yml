info:
  name: Register Duplicate RA
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/users/register"
  headers:
    - name: accept
      value: application/json
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "role": "student",
        "email": "ra-dup-{{$timestamp}}@e2e.test",
        "name": "Dup",
        "last_name": "RA",
        "password": "secret123",
        "is_active": true,
        "ra": "{{studentRa}}",
        "birth_date": null
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 409", function() {
          expect(res.status).to.equal(409);
        });
        test("error code is user_ra_already_exists", function() {
          expect(res.body.code).to.equal("user_ra_already_exists");
        });
        test("details point at ra", function() {
          expect(res.body.details.field).to.equal("ra");
        });

settings:
  encodeUrl: true

docs: |-
  Reusa o RA do estudante já registrado.

  **Espera:** 409, `code: user_ra_already_exists` e `details.field = "ra"`.
