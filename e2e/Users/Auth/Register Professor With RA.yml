info:
  name: Register Professor With RA
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/users/register"
  headers:
    - name: accept
      value: application/json
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "role": "professor",
        "email": "prof-ra-{{$timestamp}}@e2e.test",
        "name": "Professor",
        "last_name": "WithRA",
        "password": "secret123",
        "is_active": true,
        "ra": "BAD-RA",
        "birth_date": null
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 422", function() {
          expect(res.status).to.equal(422);
        });
        test("error code is validation_error", function() {
          expect(res.body.code).to.equal("validation_error");
        });

settings:
  encodeUrl: true

docs: |-
  Envia um professor com RA preenchido — proibido pelo `model_validator` do schema.

  **Espera:** 422 com `code: validation_error`.
