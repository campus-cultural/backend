info:
  name: Login Unknown Email
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/users/login"
  headers:
    - name: accept
      value: application/json
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "ghost-{{$timestamp}}@e2e.test",
        "password": "whatever"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 401", function() {
          expect(res.status).to.equal(401);
        });
        test("error code is invalid_credentials", function() {
          expect(res.body.code).to.equal("invalid_credentials");
        });

settings:
  encodeUrl: true

docs: |-
  Login com e-mail inexistente.

  **Espera:** 401 com `code: invalid_credentials` (mesmo erro de senha errada — não vaza se o usuário existe).
