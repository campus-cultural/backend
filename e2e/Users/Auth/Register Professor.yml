info:
  name: Register Professor
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/users/register"
  headers:
    - name: accept
      value: application/json
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "role": "professor",
        "email": "{{professorEmail}}",
        "name": "Professor",
        "last_name": "E2E",
        "password": "secret123",
        "is_active": true,
        "ra": null,
        "birth_date": null
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        const stamp = Date.now();
        bru.setVar("professorEmail", `professor-${stamp}@e2e.test`);
    - type: tests
      code: |-
        test("status is 201", function() {
          expect(res.status).to.equal(201);
        });
        test("body shape is correct", function() {
          expect(res.body).to.have.property("id");
          expect(res.body.role).to.equal("professor");
          expect(res.body.ra).to.equal(null);
        });
        bru.setVar("professorId", String(res.body.id));

settings:
  encodeUrl: true

docs: |-
  Registra um professor (sem RA). E-mail é gerado por run.

  **Espera:** 201 e body com role `professor`, `ra` igual a `null`.

  Armazena `professorId`.
