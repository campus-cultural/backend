info:
  name: Register Admin Forbidden
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/users/register"
  headers:
    - name: accept
      value: application/json
    - name: content-type
      value: application/json
  body:
    type: json
    data: |-
      {
        "role": "admin",
        "email": "rogue-admin-{{$timestamp}}@e2e.test",
        "name": "Rogue",
        "last_name": "Admin",
        "password": "secret123",
        "is_active": true,
        "ra": null,
        "birth_date": null
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 400", function() {
          expect(res.status).to.equal(400);
        });
        test("error code is invalid_credentials", function() {
          expect(res.body.code).to.equal("invalid_credentials");
        });

settings:
  encodeUrl: true

docs: |-
  Tenta registrar usuário com role `admin` via endpoint público.

  **Espera:** 400 com `code: invalid_credentials` (o service rejeita criação de admin).
