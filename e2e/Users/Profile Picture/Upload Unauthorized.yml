info:
  name: Upload Unauthorized
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/users/{{studentId}}/profile-picture"
  headers:
    - name: accept
      value: application/json
    - name: content-type
      value: application/octet-stream
  body:
    type: file
    data:
      - filePath: ./fixtures/pixel.png
        contentType: application/octet-stream
        selected: true

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 401", function() {
          expect(res.status).to.equal(401);
        });
        test("error code is invalid_token", function() {
          expect(res.body.code).to.equal("invalid_token");
        });

settings:
  encodeUrl: true

docs: |-
  Upload sem token.

  **Espera:** 401 com `code: invalid_token`.
