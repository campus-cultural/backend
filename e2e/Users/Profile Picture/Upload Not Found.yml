info:
  name: Upload Not Found
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/users/99999999/profile-picture"
  headers:
    - name: accept
      value: application/json
    - name: content-type
      value: application/octet-stream
  body:
    type: file
    data:
      - filePath: ./fixtures/pixel.png
        contentType: application/octet-stream
        selected: true
  auth:
    type: bearer
    token: "{{authToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status is 404", function() {
          expect(res.status).to.equal(404);
        });
        test("error code is user_not_found", function() {
          expect(res.body.code).to.equal("user_not_found");
        });

settings:
  encodeUrl: true

docs: |-
  Upload em user id inexistente.

  **Espera:** 404 com `code: user_not_found`.
